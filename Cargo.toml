[package]
name = "market_simulator"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
name = "market_simulator"
path = "src/lib.rs"

[[test]]
name = "advanced_simulation_test"
path = "tests/advanced_simulation_test.rs"

[[test]]
name = "customer_agent_integration_test"
path = "tests/customer_agent_integration_test.rs"

[[test]]
name = "simulation_test"
path = "tests/simulation_test.rs"

[[bench]]
name    = "order_book" 
harness = false       
[[bench]]
name = "order_book_enhanced"
harness = false

[[bench]]
name = "comprehensive_benchmark"
harness = false


[dependencies]
rand = "0.8"
socket2 = "0.5"
rand_distr = "0.4.3"
eframe = "0.27.2"
egui_plot = "0.27.2"
statrs = "0.18.0"
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
lazy_static = "1.4"
once_cell          = "1.18"     # for the singleton RwLock
parking_lot        = "0.12"     # for the fast RwLock in a background thread
csv = "1.3.1"
crossbeam-channel = "0.5.15"
core_affinity = "0.8.3"
dashmap = "6.1.0"

[dependencies.prost]
version = "0.12.3"

[dependencies.tokio]
version = "1.36.0"
features = ["full"]

[dependencies.axum]
version = "0.7.5"
features = ["ws", "json"]

[dependencies.futures-util]
version = "0.3.30"


[dependencies.tokio-stream]
version = "0.1.15"

[dependencies.tonic]
version = "0.11.0"

[profile.release]
debug = true

[build-dependencies]
prost-build = "0.12.3"
tonic-build = "0.11.0"

