syntax = "proto3";

package market_gateway;

// The main service definition.
service MarketGateway {
  // A single RPC call establishes a long-lived, two-way communication channel.
  rpc EventStream(stream FromPython) returns (stream ToPython);
}

// === Messages from Python Broker to Rust Agent ===
message FromPython {
  // Use `oneof` to create a tagged union, like a Rust enum.
  oneof event {
    SubmitOrderRequest submit_order = 1;
    // You can add more request types here later, e.g., CancelOrderRequest
  }
}

// === Messages from Rust Agent to Python Broker ===
message ToPython {
  oneof event {
    OrderAck order_ack = 1;
    TradeUpdate trade_update = 2;
    // You could add error messages, market data updates, etc.
  }
}

// --- Message Details ---

message SubmitOrderRequest {
  string client_id = 1; // To know which Python agent this is for
  uint64 stock_id = 2;
  string side = 3; // "Buy" or "Sell"
  double price = 4; // Use double for price, convert to u64 in Rust
  uint64 volume = 5;
  // Add order type: "Market" or "Limit"
  string order_type = 6;
}

message OrderAck {
  string client_id = 1;
  uint64 order_id = 2; // The simulation's official order ID
  string status = 3; // e.g., "Accepted", "Rejected"
  string details = 4; // Optional error message
}

message TradeUpdate {
  string client_id = 1;
  uint64 order_id = 2;
  uint64 stock_id = 3;
  double price = 4;
  uint64 volume_filled = 5;
  uint64 new_total_filled = 6;
  bool is_fully_filled = 7;
}
