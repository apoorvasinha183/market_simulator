syntax = "proto3";

package market_gateway;

// The main service definition.
service MarketGateway {
  // A single RPC call establishes a long-lived, two-way communication channel.
  rpc EventStream(stream FromPython) returns (stream ToPython);
}

// Message from Python client to Rust server
message FromPython {
  oneof event {
    SubmitOrderRequest submit_order = 1;
  }
}

// Message from Rust server to Python client
message ToPython {
  oneof event {
    OrderAck order_ack = 1;
    TradeUpdate trade_update = 2;
    MarketUpdate market_update = 3;
  }
}

// --- Message Definitions ---

message SubmitOrderRequest {
  string client_id = 1;
  uint64 stock_id = 2;
  string side = 3;
  double price = 4; // For limit orders
  uint64 volume = 5;
  string order_type = 6; // "Market" or "Limit"
}

message OrderAck {
  string client_id = 1;
  uint64 order_id = 2;
  string status = 3;
  string details = 4;
  uint64 stock_id = 5;
  string side = 6;
  uint64 volume = 7;
}

message TradeUpdate {
  string client_id = 1;
  uint64 order_id = 2;
  uint64 stock_id = 3;
  double price = 4;
  uint64 volume_filled = 5;
  uint64 new_total_filled = 6;
  bool is_fully_filled = 7;
}

message MarketUpdate {
    uint64 stock_id = 1;
    double best_bid_price = 2;
    uint64 best_bid_volume = 3;
    double best_ask_price = 4;
    uint64 best_ask_volume = 5;
    double last_traded_price = 6;
}

